[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/rusticord"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["altugcetin <altugberkcetin@gmail.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/altugcetin/Rusticord"
publish = false

[workspace.dependencies]
gpui-kit = { version = "=0.6.0", default-features = false, features = ["component", "assets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
bytes = "1"
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "stream",
    "rustls-tls-webpki-roots-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = { version = "0.4", default-features = false }
redb = "2"
postcard = { version = "1", default-features = false, features = ["use-std"] }
base64 = "0.22"
sha2 = "0.10"
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng", "getrandom"] }
keyring = "3"
zeroize = { version = "1", features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
