[workspace]
resolver = "3"
members = [
    "apps/*",
    "crates/*",
]
default-members = [
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["altugcetin <altugberkcetin@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/altugcetin/Rusticord"
publish = false

[workspace.dependencies]
gpui = "=0.2.2"

serde = { version = "1", features = ["derive"]}
serde_json = "1"
thiserror= "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

uuid = { version = "1", features = ["v4", "serde"]}

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"