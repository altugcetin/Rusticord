[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/rusticord"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["altugcetin <altugberkcetin@gmail.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/altugcetin/Rusticord"
publish = false

[workspace.dependencies]
gpui-kit = { version = "=0.6.0", default-features = false, features = ["component", "assets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
